[package]
name = "graphloop"
version = "0.1.0"
edition = "2024"
description = "Graphspec (.yah) vault, parser and one-command team launcher for agent-cli-lab"
license = "MIT"

[lib]
name = "graphloop"
path = "src/lib.rs"

[[bin]]
name = "graphloop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
