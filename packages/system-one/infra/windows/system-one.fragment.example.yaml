# As installed on the Windows machine (2026-10-13), generated by: python -m system_one.llama_swap show
# These two blocks are merged by `python -m system_one.llama_swap install --config <path>` into the live llama-swap config
# (model entry under `models:`, group under `groups:`). Paths are this machine's: regenerate, do not copy.
# Single-quoted env scalars are deliberate: double-quoted YAML turns backslashes into escape sequences and the config fails to load.
  "system-one":
    cmd: >
      D:\projects\system-one\.venv\Scripts\python.exe -m system_one.serve --port ${PORT} --host 127.0.0.1
    env:
      - 'PYTHONPATH=D:\projects\system-one\src'
      - 'SYSTEM_ONE_STUDENT=D:\projects\system-one\data\student_model.json'
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 0
groups:
  "system-one-group":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "system-one"
