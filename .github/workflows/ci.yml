name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: plan (changed packages)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: m
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          # on push to main compare with the previous commit instead
          [ "${{ github.event_name }}" = push ] && base="${{ github.event.before }}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          echo "matrix=$(node tools/pkg.mjs matrix "$base")" | tee -a "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.package }} (${{ matrix.os }})
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] != null }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.toolchain == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: matrix.toolchain == 'python'
        uses: astral-sh/setup-uv@v5
      - if: matrix.toolchain == 'rust'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: node tools/pkg.mjs ci ${{ matrix.package }}

  windows-browser:
    name: Windows browser control (compile + unit smoke)
    needs: plan
    if: contains(needs.plan.outputs.matrix, 'pi-agent-extensions')
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/pi-agent-extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - run: npm run build:min
      # No desktop/session is available on hosted CI; live interaction is opt-in locally.
      - run: node --test browser-control/tests/windows.test.ts

  # single required status check for branch protection
  all-green:
    if: always()
    needs: [plan, package, windows-browser]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.package.result }}" != failure ] && [ "${{ needs.package.result }}" != cancelled ] && [ "${{ needs.windows-browser.result }}" != failure ] && [ "${{ needs.windows-browser.result }}" != cancelled ]
